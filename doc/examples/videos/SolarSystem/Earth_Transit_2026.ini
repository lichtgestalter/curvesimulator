# CurveSimulator configuration file https://github.com/lichtgestalter/curvesimulator

# The Solar System (Sun + 8 planets + Pluto)
# Source of orbital elements:
#     Planets: JPL "Keplerian Elements for Approximate Positions of the Major
#         Planets" (Standish & Williams 1992), J2000.0 epoch, mean ecliptic/equinox of J2000.
#         https://ssd.jpl.nasa.gov/planets/approx_pos.html
#     Pluto: NASA Pluto Fact Sheet, J2000.0 mean orbital elements.
#         https://nssdc.gsfc.nasa.gov/planetary/factsheet/plutofact.html

# Inclination convention: i_Exoplanets = 90 deg - i_SolarSystem

# Omega (ascending node) and pomega (longitude of periapsis) are in-plane angles and therefore left unchanged.

# All planets use an explicit primary (Sun), so Jacobi ordering is not required.


[Astronomical Constants]                # Do not remove any parameters from this section! You may use the constants defined in this section in all subsequent sections, e.g. "scope_left = 1.9 * au".
g = 6.67430e-11                         # [m^3 / (kg * s^2)] Gravitational constant
au = 1.495978707e11                     # [m]   Astronomical unit
l_sun = 3.828e26                        # [W]   Solar luminosity
r_sun = 6.957e8                         # [m]   Solar radius R⊙
m_sun = 1.98847e30                      # [kg]  Solar mass M⊙
r_jup = 7.1492e7                        # [m]   Jupiter radius
m_jup = 1.8981246e27                    # [kg]  Jupiter mass
r_nep = 2.4622e7                        # [m]   Neptune radius
m_nep = 1.024092e26                     # [kg]  Neptune mass
r_earth = 6.378135e6                    # [m]   Earth radius R⊕
m_earth = 5.9720e24                     # [kg]  Earth mass M⊕
hour = 60 * 60                          # [s]   One hour in seconds
day = hour * 24                         # [s]   One day in seconds
year = day * 365.24219                  # [s]   Approximate length of one tropical Earth year
rad2deg = 57.29577951308232             # Conversion factor: radians to degrees (180 / π)

[Results]                               #
results_directory = .                   # Results are saved in the next available numbered subdirectory.
result_file = SolarSystem.json          # Simulation results, such as transit times, are saved to this file into the <results_directory>. Optional in single runs. Filename only (contains no path).
comment = No comment                    # Optional comment for use via the Python API e.g. as the title of result plots.
verbose = True                          # If False, only error messages are printed to the console. Useful when running MCMC.
transit_precision = 1                   # [s] Simulated TT, T1, etc. are calculated to this precision.
max_interval_extensions = 10            # Integer: In unstable systems or when using a very large dt, the search for a Transit Time (TT) may have to be extended. If no TT is found within max_interval_extensions * dt of the expected transit interval, the search for that particular TT is aborted.
flux_data_directory = .                 # Downloaded and processed flux data are saved to this directory.
tt_padding = 0.3                        # In flux dataplots for single transits, the time axis ranges from tt - tt_padding to tt + tt_padding.
bins = 30                               # Integer(s): Number of bins in mcmc histograms. Multiple values may be specified, separated by commas. Then a histogram will be generated for every bin value.
flux_plots_top = 1.015                  # Upper y-axis limit for normalized flux plots.
flux_plots_bottom = 0.97                # Lower y-axis limit for normalized flux plots.
unit = {"mass": "m_jup", "radius": "r_jup", "e": "1", "i": "deg", "P": "d", "a": "AU", "Omega": "deg", "omega": "deg", "pomega": "deg", "L": "deg", "ma": "deg", "ea": "deg", "nu": "deg", "T": "s", "rv_offset": "m/s", "rv_jitter": "m/s"}  # Dictionary: Specify the display unit for each parameter in result plots.
scale = {"mass": 1/m_jup, "radius": 1/r_jup, "e": 1, "i": rad2deg, "P": 1/day, "a": 1/au, "Omega": rad2deg, "omega": rad2deg, "pomega": rad2deg, "L": rad2deg, "ma": rad2deg, "ea": rad2deg, "nu": rad2deg, "T": 1, "rv_offset": 1, "rv_jitter": 1}  # Dictionary: Conversion factors applied to each parameter so that values are displayed in the units specified in parameter unit.
free_parameters = None                  # Integer: Relevant in single runs only. Used to calculate the correct p-values.

[Simulation]                            #
action = single_run                     # Allowed values: mcmc (MCMC fit), lmfit (least-squares fit), single_run (run one simulation), guifit (upcoming feature), results_only (upcoming feature, read existing results and generate reports)
jacobi_masses =  False                  # REBOUND parameter. See https://rebound.hanno-rein.de/ipython_examples/OrbitalElements/ .
dt = 100                                # [s] Time step between simulation iterations. Use a larger value to improve MCMC performance. Use a smaller value for video generation or when accurate transit times are required.
epoch =     2461041.5                   # [days] Start date of the simulation, typically expressed as a Barycentric Julian Date (TDB).
sim_start = 2461234.2                   # [days] Start time of the interval for which simulation data are calculated.
sim_end =   2461235.3                   # [days] End time of the interval for which simulation data are calculated.
rv_body_name = Sun                      # Name of the relevant star for radial velocity measurements. There can be max one RV body.

[Fitting]                               #
eclipsers_names = Sun, Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto  # Only primary transits of these bodies are considered when fitting transit times or when calculating transit parameters. Separate body names with commas.
eclipsees_names = Sun, Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune, Pluto  # Only transits across these bodies are considered when fitting transit times or when calculating transit parameters. Separate body names with commas.

[Video]                                 #
video_file = Earth_Transit.mp4     # The generated video is saved to this file into the <results_directory>. Comment out this parameter to disable video generation. Filename only (contains no path).
frames = 300                            # Integer: Number of video frames. Increasing this value increases both rendering time and animation length.
fps = 25                                # Integer: Frames per second. Set to 25 or higher for good quality. Higher values make the animation play faster and shorten its duration.
clockwise = False                       # When viewed from above, do the bodies orbit their primary clockwise?

[VideoScale]                            # Controls the visual scale of objects in the animation.
scope_left = 1.35 * au                  # [m] The left plot displays the region [-scope_left, scope_left]. The plot is centered on (0, 0).
scale_bar_length_left = au              # [m] Real-world length represented by the scale bar in the left plot.
star_scale_left = 10.0                  # If autoscaling is disabled, star radii are multiplied by this factor in the left view.
planet_scale_left = 200.0               # If autoscaling is disabled, planet radii are multiplied by this factor in the left view.
scope_right = 0.00675 * au               # [m] The right plot displays the region [-scope_right, scope_right]. The plot is centered on (0, 0).
scale_bar_length_right = 0.005 * au      # [m] Real-world length represented by the scale bar in the right plot.
star_scale_right = 1.0                  # If autoscaling is disabled, star radii are multiplied by this factor in the right view.
planet_scale_right = 1.0                # If autoscaling is disabled, planet radii are multiplied by this factor in the right view.
autoscaling = off                       # Allowed values: on, off
;min_radius = 0.4                        # [%] If autoscaling is enabled, the smallest celestial body has this radius relative to the plot size. Radius = 100 would fill the entire plot.
;max_radius = 2.0                        # [%] If autoscaling is enabled, the largest celestial body has this radius relative to the plot size. Radius = 100 would fill the entire plot. If necessary, scaling is performed logarithmically instead of linearly.

[VideoPlot]                             #
video_background_color = xkcd:black     # Specify all colors in this configuration file as RGB tuples e.g. 0.5, 0.2, 0.9 or as strings (e.g. white.)
video_text_color = xkcd:light gray      # Color of all texts apart from main title. Also color of all tics and scale bars.
separator_line_color = xkcd:medium gray  # Color of vertical separator line between left plot and right plot.
scale_bar_fontsize = 8                  # Size of text of the scale bars.
scale_bar_end_x = 0.85                  # x position of the right end of the scale bars
show_left_plot = True                   # Show the star system viewed from above (upper-left plot)?
show_right_plot = True                  # Show the star system viewed from Earth (upper-right plot)?
show_upper_curve = True                 # Show the light curve plot (flux)?
show_lower_curve = False                # Show the radial velocity plot?
main_title = Solar System - The Year 2026  # Main title of the plot.
main_title_color = xkcd:white           # Color of the main title on top of the video.
main_title_fontsize = 14                # Fontsize of the main title on top of the video.
left_title = View from above (10 x star size, 200 x planet size)  # Title of the left plot.
left_title_fontsize = 10                # Fontsize of the title of the left plot (view from above) of the video.
left_title_y_coord = 0.9                # Vertical position of the title of the left plot (view from above) of the video. 0 is bottom. 1 is top.
show_left_scale_bar = True              # Show the scalebar of the left plot?
right_title = Edge View (200 x zoom, bodies to scale)  # Title of the right plot.
right_title_fontsize = 10               # Fontsize of the title of the right plot (view from above) of the video.
right_title_y_coord = 0.9               # Vertical position of the title of the right plot (view from above) of the video. 0 is bottom. 1 is top.
show_right_scale_bar = True             # Show the scalebar of the right plot?
dot_height = 0.077                      # Height of the moving dot in the curve plots relative to the y-axis height.
dot_width = 0.005                       # Width of the moving dot in the curve plots relative to the y-axis height.
x_ticks_fontsize = 8                    # Fontsize of the ticks (numbers) at the common time-axis/x-axis of both curve plots.
x_label = BJD (TDB)                     # Label at the common time-axis/x-axis of both curve plots.
x_label_fontsize = 8                    # Fontsize of the label at the common time-axis/x-axis of both curve plots.
x_label_x_coord = 0.97                  # Horizontal position of the label at the common time-axis/x-axis of both curve plots. 0 ist left. 1 is right.
x_label_y_coord = 0.04                  # Vertical position of the label at the common time-axis/x-axis of both curve plots. 0 ist bottom. 1 is top.
upper_curve_color = xkcd:white          # Color of the curve in the upper curve plot.
upper_curve_y_label = Relative Flux     # Label at the y-axis of the upper curve plot.
upper_curve_y_label_fontsize = 8        # Fontsize of the label at the y-axis of the upper curve plot.
upper_curve_y_tick_fontsize = 8         # Fontsize of the ticks at the y-axis of the upper curve plot.
upper_curve_dot_color = xkcd:bright red  # Color of the moving dot in the upper curve plot.
lower_curve_color = xkcd:white          # Color of the curve in the lower curve plot.
lower_curve_y_label = Radial Velocity [m/s]  # Label at the y-axis of the lower curve plot.
lower_curve_y_label_fontsize = 8        # Fontsize of the label at the y-axis of the lower curve plot.
lower_curve_y_tick_fontsize = 8         # Fontsize of the ticks at the y-axis of the lower curve plot.
lower_curve_dot_color = xkcd:green apple  # Color of the moving dot in the lower curve plot.
figure_width = 16                       # Integer: Width of the figure containing all plots and animations. Adjust this parameter only if the plots in the video do not fit on your screen.
figure_height = 8                       # Integer: Height of the figure containing all plots and animations. Adjust this parameter only if the plots in the video do not fit on your screen.
xlim = 1.25                             # Left and right views show x-values between -xlim and +xlim. Adjust this parameter only if the plots in the video do not fit on your screen.
ylim = 1.0                              # Left and right views show y-values between -ylim and +ylim. Adjust this parameter only if the plots in the video do not fit on your screen.


