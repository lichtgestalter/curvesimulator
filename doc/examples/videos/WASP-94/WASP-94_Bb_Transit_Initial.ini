# CurveSimulator configuration file https://github.com/lichtgestalter/curvesimulator

# Double Hot Jupiter Formation through Mirrored ZLK Migration in Binary Star Systems: The Case of WASP-94
# Yurou Liu, Tiger Lu, and Malena Rice
# Published 2026, The Astrophysical Journal Letters, Volume 997, Number 2
# https://iopscience.iop.org/article/10.3847/2041-8213/ae2fd8

[Astronomical Constants]                # You may use the constants defined in this section in all subsequent sections, e.g. "scope_left = 1.9 * au". Do not remove any parameters from this section!
g = 6.67430e-11                         # [m^3 / (kg * s^2)] Gravitational constant
au = 1.495978707e11                     # [m]   Astronomical unit
l_sun = 3.828e26                        # [W]   Solar luminosity
r_sun = 6.957e8                         # [m]   Solar radius R⊙
m_sun = 1.98847e30                      # [kg]  Solar mass M⊙
r_jup = 7.1492e7                        # [m]   Jupiter radius
m_jup = 1.8981246e27                    # [kg]  Jupiter mass
r_nep = 2.4622e7                        # [m]   Neptune radius
m_nep = 1.024092e26                     # [kg]  Neptune mass
r_earth = 6.378135e6                    # [m]   Earth radius R⊕
m_earth = 5.9720e24                     # [kg]  Earth mass M⊕
hour = 60 * 60                          # [s]   One hour in seconds
day = 60 * 60 * 24                      # [s]   One day in seconds
year = 60 * 60 * 24 * 365.25            # [s]   Julian year
rad2deg = 57.29577951308232             # Conversion factor: radians to degrees (180 / π)

[Results]                               #
verbose = True                          # If False, only error messages are printed to the console. Useful when running MCMC.
;results_directory = ../../curvesimulator.internal/results/WASP-94  # Results are saved in the next available numbered subdirectory.

[Simulation]                            #
action = single_run                     # Allowed values: mcmc (MCMC fit), lmfit (least-squares fit), single_run (run one simulation), get_tess_data, process_tess_data, guifit (upcoming feature), results_only (upcoming feature, read existing results and generate reports).
jacobi_masses = False                   # REBOUND parameter. See https://rebound.hanno-rein.de/ipython_examples/OrbitalElements/ .
dt = 100000                             # [s] Time step between simulation iterations. Use a larger value to improve MCMC performance. Use a smaller value for video generation or when accurate transit times are required.
epoch =     0                           # [days] Start date of the simulation, typically expressed as a Barycentric Julian Date (TDB).
sim_start = 7880000                     # [days] Start times of the intervals for which simulation data are calculated.
sim_end =   7900000                     # [days] End times of the intervals for which simulation data are calculated.
rv_body_name = WASP94A                  # Name of the star for which radial velocities were measured.

[Fitting]
eclipsers_names = WASP94A, WASP94Ab, WASP94B, WASP94Bb  # Only primary transits of these bodies are considered when fitting transit times. Separate body names with commas.
eclipsees_names = WASP94A, WASP94B      # Only transits across these bodies are considered when fitting transit times. Separate body names with commas.

[Video]                                 #
video_file = WASP-94_Bb_Transit_Initial.mp4  # The generated video is saved to this file. Comment out this parameter to disable video generation.
frames = 400                            # Integer: Number of video frames. Increasing this value increases both rendering time and animation length.
fps = 25                                # Integer: Frames per second. Set to 25 or higher for good quality. Higher values make the animation play faster and shorten its duration.
clockwise = False                       # When viewed from above, do the bodies orbit their primary clockwise?

[VideoScale]                            # Controls the visual scale of objects in the animation.
scope_left = 130 * au                   # [m] The left plot displays the region [-scope_left, scope_left]. The plot is centered on (0, 0).
scale_bar_length_left = 50 * au         # [m] Real-world length represented by the scale bar in the left plot.
star_scale_left = 90.0                  # If autoscaling is disabled, star radii are multiplied by this factor in the left view.
planet_scale_left = 700.0               # If autoscaling is disabled, planet radii are multiplied by this factor in the left view.

offset_x_right = -79 * au               # higher offset moves bodies to the right when clockwise=False
offset_y_right = -100 * au              # higher offset moves bodies down
scope_right = 10 * au                   # [m] The right plot displays the region [-scope_right, scope_right]. The plot is centered on (0, 0).
scale_bar_length_right = 5 * au         # [m] Real-world length represented by the scale bar in the right plot.
star_scale_right = 7                    # If autoscaling is disabled, star radii are multiplied by this factor in the right view.
planet_scale_right = 50.0               # If autoscaling is disabled, planet radii are multiplied by this factor in the right view.

autoscaling = False                     # Allowed values: on, off
;min_radius = 0.2                        # [%] If autoscaling is enabled, the smallest celestial body has this radius relative to the plot size. Radius = 100 would fill the entire plot.
;max_radius = 1.0                        # [%] If autoscaling is enabled, the largest celestial body has this radius relative to the plot size. Radius = 100 would fill the entire plot. If necessary, scaling is performed logarithmically instead of linearly.

[VideoPlot]                             #
video_background_color = xkcd:black     # You can specify all colors in this configuration file as RGB tuples e.g. 0.5, 0.2, 0.9 or as strings e.g. white.
video_text_color = xkcd:light gray      # Color of all texts apart from main title. Also color of all tics and scale bars.
separator_line_color = xkcd:medium gray  # Color of vertical separator line between left plot and right plot.
scale_bar_fontsize = 8                  # Size of text of the scale bars.
scale_bar_end_x = 0.95                  # x position of the right end of the scale bars
show_left_plot = True                   # Show the star system viewed from above (upper-left plot)?
show_right_plot = True                  # Show the star system viewed from Earth (upper-right plot)?
show_upper_curve = False                # Show the light curve plot (flux)?
show_lower_curve = True                 # Show the radial velocity plot?
main_title = WASP-94, B and Bb, initial state, 20k days  # Main title of the plot.
main_title_color = xkcd:white           # Color of the main title on top of the video. You can specify all colors in this configuration file as RGB tuples e.g. 0.5, 0.2, 0.9 or as strings e.g. white.
main_title_fontsize = 14                # Fontsize of the main title on top of the video.
left_title = A-B orbit edge on, stars enlarged 90x, planets 700x  # Title of the left plot.
left_title_fontsize = 9                # Fontsize of the title of the left plot (view from above) of the video.
left_title_y_coord = 0.9                # Vertical position of the title of the left plot (view from above) of the video. 0 is bottom. 1 is top.
show_left_scale_bar = True              # Show the scalebar of the left plot?
right_title = B-Bb orbit almost edge on, stars enlarged 7x, planets 50x, 13x zoom compared to the left side  # Title of the right plot.
right_title_fontsize = 9               # Fontsize of the title of the right plot (view from above) of the video.
right_title_y_coord = 0.9               # Vertical position of the title of the right plot (view from above) of the video. 0 is bottom. 1 is top.
show_right_scale_bar = True             # Show the scalebar of the right plot?
;dot_height = 1/22                       # Height of the red dot in the light curve plot relative to the y-axis height.
dot_width = 1/290                       # Width of the red dot in the light curve plot relative to the x-axis width.
x_ticks_fontsize = 8                    # Fontsize of the ticks (numbers) at the common time-axis/x-axis of both curve plots.
x_label = BJD (TDB)                     # Label at the common time-axis/x-axis of both curve plots.
x_label_fontsize = 8                    # Fontsize of the label at the common time-axis/x-axis of both curve plots.
x_label_x_coord = 0.97                  # Horizontal position of the label at the common time-axis/x-axis of both curve plots. 0 ist left. 1 is right.
x_label_y_coord = -0.07                 # Vertical position of the label at the common time-axis/x-axis of both curve plots. 0 ist bottom. 1 is top.
;upper_curve_color = xkcd:white          # Color of the curve in the upper curve plot.
;upper_curve_y_label = Relative Flux     # Label at the y-axis of the upper curve plot.
;upper_curve_y_label_fontsize = 8        # Fontsize of the label at the y-axis of the upper curve plot.
;upper_curve_y_tick_fontsize = 8         # Fontsize of the ticks at the y-axis of the upper curve plot.
;upper_curve_dot_color = xkcd:nice blue  # Color of the moving dot in the upper curve plot.
lower_curve_color = xkcd:white          # Color of the curve in the lower curve plot.
lower_curve_y_label = Radial Velocity [m/s]  # Label at the y-axis of the lower curve plot.
lower_curve_y_label_fontsize = 8        # Fontsize of the label at the y-axis of the lower curve plot.
lower_curve_y_tick_fontsize = 8         # Fontsize of the ticks at the y-axis of the lower curve plot.
lower_curve_dot_color = xkcd:nice blue  # Color of the moving dot in the lower curve plot.
figure_width = 16                       # Integer: Width of the figure containing all plots and animations. Adjust this parameter only if the plots in the video do not fit on your screen.
figure_height = 8                       # Integer: Height of the figure containing all plots and animations. Adjust this parameter only if the plots in the video do not fit on your screen.
xlim = 1.25                             # Left and right views show x-values between -xlim and +xlim. Adjust this parameter only if the plots in the video do not fit on your screen.
ylim = 1.0                              # Left and right views show y-values between -ylim and +ylim. Adjust this parameter only if the plots in the video do not fit on your screen.

[WASP94A]
body_type = star
color = 1, 1, 1
primary = self
luminosity = 2.42 * l_sun               # derived from radius and T_eff = 6170 K
limb_darkening_parameter_type = u       # quadratic law parameters u1, u2
limb_darkening_1 = 0.53                 # Limb-darkening coefficient 1.
limb_darkening_2 = 0.09                 # Limb-darkening coefficient 2.
mass = 1.29 * m_sun                     # stellar mass adopted in the simulation
radius = 1.36 * r_sun                   # stellar radius adopted in the simulation

[WASP94Ab]
body_type = planet
color = 1, 0, 0
primary = WASP94A
mass = 0.452 * m_jup                    # observed planetary mass from RV; used in simulation
radius = 1.665 * r_jup                  # adopted planetary radius
a = 7.26 * au                           # initial semimajor axis in the simulation
e = 0                                   # initially assumed circular
i = 84.4                                # inclination relative to the A-B binary orbital plane
Omega = 0                               # longitude of ascending node; coordinate choice, not measured
omega = 0                               # argument of periapsis; coordinate choice, not measured
nu = 0                                  # true anomaly; arbitrary phase, not specified by the paper

[WASP94B]
body_type = star
color = 0.7, 0.6, 0.4
primary = WASP94A
luminosity = 2.19 * l_sun               # derived from radius and T_eff = 6040 K
limb_darkening_parameter_type = u       # quadratic law parameters u1, u2
limb_darkening_1 = 0.55                 # Limb-darkening coefficient 1.
limb_darkening_2 = 0.10                 # Limb-darkening coefficient 2.
mass = 1.24 * m_sun                     # stellar mass adopted in the simulation
radius = 1.35 * r_sun                   # stellar radius adopted in the simulation
a = 1689 * au                           # semimajor axis adopted for the wide binary orbit
e = 0.88                                # eccentricity adopted for the wide binary orbit
i = 0                                   # A-B binary plane defines the reference plane
Omega = 0                               # coordinate choice
omega = 0                               # coordinate choice
nu = 180                                # places B at apoapsis, as assumed in the paper

[WASP94Bb]
body_type = planet
color = 0, 1, 0
primary = WASP94B
mass = 0.618 * m_jup                    # RV gives M*sin(i); paper adopts this as the planet mass
radius = 1.665 * r_jup                  # radius assumed equal to Ab; Bb's radius is unknown
a = 6.58 * au                           # initial semimajor axis in the simulation
e = 0                                   # initially assumed circular
i = 92.84                               # inclination relative to the A-B binary orbital plane
Omega = 0                               # longitude of ascending node; coordinate choice, not measured
omega = 0                               # argument of periapsis; coordinate choice, not measured
nu = 0                                  # true anomaly; arbitrary phase, not specified by the paper
