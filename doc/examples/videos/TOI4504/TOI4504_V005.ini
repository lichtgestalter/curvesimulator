# development of the transits of Planet d:
# first full transit in 2026

[Astronomical Constants]                # Do not remove any parameters from this section! You may use the constants defined in this section in all subsequent sections, e.g. "scope_left = 1.9 * au".
g = 6.67430e-11                         # [m^3 / (kg * s^2)] Gravitational constant
au = 1.495978707e11                     # [m]   Astronomical unit
l_sun = 3.828e26                        # [W]   Solar luminosity
r_sun = 6.957e8                         # [m]   Solar radius R⊙
m_sun = 1.98847e30                      # [kg]  Solar mass M⊙
r_jup = 7.1492e7                        # [m]   Jupiter radius
m_jup = 1.8981246e27                    # [kg]  Jupiter mass
r_nep = 2.4622e7                        # [m]   Neptune radius
m_nep = 1.024092e26                     # [kg]  Neptune mass
r_earth = 6.378135e6                    # [m]   Earth radius R⊕
m_earth = 5.9720e24                     # [kg]  Earth mass M⊕
hour = 60 * 60                          # [s]   One hour in seconds
day = hour * 24                         # [s]   One day in seconds
year = day * 365.24219                  # [s]   Approximate length of one tropical Earth year
rad2deg = 57.29577951308232             # Conversion factor: radians to degrees (180 / π)

[Results]                               #
verbose = True                          # If False, only error messages are printed to the console. Useful when running MCMC.

[Simulation]                            #
action = single_run                     # Allowed values: mcmc (MCMC fit), lmfit (least-squares fit), single_run (run one simulation), get_tess_data, process_tess_data, guifit (upcoming feature), results_only (upcoming feature, read existing results and generate reports)
jacobi_masses = True                    # REBOUND parameter. See https://rebound.hanno-rein.de/ipython_examples/OrbitalElements/ .
rebound_warnings = True                 # When False, most rebound warnungs will be suppressed.
dt = 40                                 # [s] Time step between simulation iterations. Use a larger value to improve MCMC performance. Use a smaller value for video generation or when accurate transit times are required.
epoch = 2458400                         # [days] Start date of the simulation, typically expressed as a Barycentric Julian Date (TDB).
sim_start = 2461022.45                  # [days] Start time of the interval for which simulation data are calculated.
sim_end = 2461022.85                    # [days] End time of the interval for which simulation data are calculated.
rv_body = TOI4504                       # Name of the relevant star for radial velocity measurements. There can be max one RV body.

[Video]                                 #
video_file = TOI4504_V005_d_transit_in_2026.mp4  # The generated video is saved to this file. Comment out this parameter to disable video generation.
frames = 800                            # Integer: Number of video frames. Increasing this value increases both rendering time and animation length.
fps = 80                                # Integer: Frames per second. Set to 25 or higher for good quality. Higher values make the animation play faster and shorten its duration.
clockwise = False                       # When viewed from above, do the bodies orbit their primary clockwise?

[VideoScale]                            # Controls the visual scale of objects in the animation.
scope_left = 0.4 * au                   # [m] The left plot displays the region [-scope_left, scope_left]. The plot is centered on (0, 0).
scale_bar_length_left = 0.1 * au        # [m] Real-world length represented by the scale bar in the left plot.
star_scale_left = 4.0                   # If autoscaling is disabled, star radii are multiplied by this factor in the left view.
planet_scale_left = 10.0                # If autoscaling is disabled, planet radii are multiplied by this factor in the left view.
scope_right = 0.02 * au                # [m] The right plot displays the region [-scope_right, scope_right]. The plot is centered on (0, 0).
scale_bar_length_right = 0.005 * au     # [m] Real-world length represented by the scale bar in the right plot.
star_scale_right = 1.0                  # If autoscaling is disabled, star radii are multiplied by this factor in the right view.
planet_scale_right = 1.0                # If autoscaling is disabled, planet radii are multiplied by this factor in the right view.
autoscaling = off                       # Allowed values: on, off
;min_radius = 0.4                        # [%] If autoscaling is enabled, the smallest celestial body has this radius relative to the plot size. Radius = 100 would fill the entire plot.
;max_radius = 2.0                        # [%] If autoscaling is enabled, the largest celestial body has this radius relative to the plot size. Radius = 100 would fill the entire plot. If necessary, scaling is performed logarithmically instead of linearly.

[VideoPlot]                             #
show_left_plot = True                   # Show the star system viewed from above (upper-left plot).
show_right_plot = True                  # Show the star system viewed from Earth (upper-right plot).
show_upper_curve = True                     # Show the light curve plot (flux).
show_lower_curve = False                    # Show the radial velocity plot.
main_title = First full transit of TOI4504d in 2026, i = 89.00  # Main title of the plot.
left_title = View from above (4 x star size, 10 x planet size)  # Title of the left plot.
right_title = View from Earth (20 x zoom, bodies to scale)  # Title of the right plot.
dot_height = 1/10                  # Height of the red dot in the light curve plot relative to the y-axis height.
dot_width = 1/200                  # Width of the red dot in the light curve plot relative to the x-axis width.
figure_width = 16                       # Integer: Width of the figure containing all plots and animations. Adjust this parameter only if the plots in the video do not fit on your screen.
figure_height = 8                       # Integer: Height of the figure containing all plots and animations. Adjust this parameter only if the plots in the video do not fit on your screen.
xlim = 1.25                             # Left and right views show x-values between -xlim and +xlim. Adjust this parameter only if the plots in the video do not fit on your screen.
ylim = 1.0                              # Left and right views show y-values between -ylim and +ylim. Adjust this parameter only if the plots in the video do not fit on your screen.

[TOI4504]                               # All subsequent sections define celestial bodies in the simulation. Section names define the body names. REBOUND supports only plain ASCII characters in body names. When Jacobi coordinates are used, bodies must be ordered from the inside out (e.g., star, inner planet, outer planet). This section is intended solely as a reference example. It specifies every supported parameter, although many of them are mutually exclusive or redundant, and therefore should not be used as an actual body definition.
color = 0.99, 0.99, 0.99                # [1]*3 RGB values used in the animation. All three values must be between 0 and 1.
body_type = star                        # star or planet
mass = 0.885 * m_sun                    # [kg]
radius = 0.92 * r_sun                   # [m]
rv_offset = -2052.686250                # [m/s] Constant shift added to measured RV values to correct for a zero-point difference between the instrument or model and the star’s true line-of-sight velocity. rv_rel = rv_obs + rv_offset
rv_jitter = 99.43006                    # [m/s] Standard deviation of the stellar jitter term, i.e. the typical size of extra RV scatter not caused by planets.
luminosity = 0.62 * l_sun               # [W]
limb_darkening_parameter_type = u       # limb_darkening_parameter_type = a  # q (Kipping parameters q1, q2), u (quadratic law parameters u1, u2), or a (polynomial coefficients a1, a2; do not provide a0).
limb_darkening_1 = 0.17355              # Limb-darkening coefficient 1.
limb_darkening_2 = 0.31489              # Limb-darkening coefficient 2.

[TOI4504d]
color = 0.99, 0.55, 0.11                # [1]*3 RGB values used in the animation. All three values must be between 0 and 1.
body_type = planet                      # star or planet
mass = 2.093560275 * m_jup              # [kg]
radius = 1.085423176 * r_jup            # [m]
e = 0.260171585                         # [1] Eccentricity.
i = 88.74616                            # [deg] Inclination. 90°: the orbit is viewed edge-on. >90°: the planet moves below and in front of the star, as well as above and behind the star in the edge-on view.
P = 41.806141 * day                     # [s] Orbital period. Provide P or a.
Omega = 0.0                             # [deg] Ω: longitude of ascending node. Specify two parameters out of Omega, omega, and pomega.
omega = 270.7549465                     # [deg] ω: argument of periapsis/pericenter/periastron. Specify two parameters out of Omega, omega, and pomega.
ma = 349.6932931                        # [deg] Mean anomaly. Specify one parameter out of L, ma, ea, nu, and T.

[TOI4504c]
color = 0.67, 0.48, 0.85                # [1]*3 RGB values used in the animation. All three values must be between 0 and 1.
body_type = planet                      # star or planet
mass = 2.624407891 * m_jup              # [kg]
radius = 1.064014627 * r_jup            # [m]
e = 0.037642491                         # [1] Eccentricity.
i = 89.69211                            # [deg] Inclination. 90°: the orbit is viewed edge-on. >90°: the planet moves below and in front of the star, as well as above and behind the star in the edge-on view.
P = 81.810197 * day                     # [s] Orbital period. Provide P or a.
Omega = 357.820921                      # [deg] Ω: longitude of ascending node. Specify two parameters out of Omega, omega, and pomega.
omega = 298.5823985                     # [deg] ω: argument of periapsis/pericenter/periastron. Specify two parameters out of Omega, omega, and pomega.
ma = 143.1278754                        # [deg] Mean anomaly. Specify one parameter out of L, ma, ea, nu, and T.
