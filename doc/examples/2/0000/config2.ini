[Astronomical Constants]                # You may use the constants defined in this section in all subsequent sections, e.g. "scope_left = 1.9 * au". Do not remove any parameters from this section!
g = 6.67430e-11                         # [m^3 / (kg * s^2)] Gravitational constant
au = 1.495978707e11                     # [m]   Astronomical unit
l_sun = 3.828e26                        # [W]   Solar luminosity
r_sun = 6.957e8                         # [m]   Solar radius R⊙
m_sun = 1.98847e30                      # [kg]  Solar mass M⊙
r_jup = 7.1492e7                        # [m]   Jupiter radius
m_jup = 1.8981246e27                    # [kg]  Jupiter mass
r_nep = 2.4622e7                        # [m]   Neptune radius
m_nep = 1.024092e26                     # [kg]  Neptune mass
r_earth = 6.378135e6                    # [m]   Earth radius R⊕
m_earth = 5.9720e24                     # [kg]  Earth mass M⊕
hour = 60 * 60                          # [s]   One hour in seconds
day = hour * 24                         # [s]   One day in seconds
year = day * 365.24219                  # [s]   Approximate length of one tropical Earth year
rad2deg = 57.29577951308232             # Conversion factor: radians to degrees (180 / π)

[Results]                               #
verbose = True                          # If False, only error messages are printed to the console. Useful when running MCMC.

[Simulation]                            #
action = single_run                     # Allowed values: mcmc (MCMC fit), lmfit (least-squares fit), single_run (run one simulation), get_tess_data, process_tess_data, guifit (upcoming feature), results_only (upcoming feature, read existing results and generate reports).
jacobi_masses = True                    # REBOUND parameter. See https://rebound.hanno-rein.de/ipython_examples/OrbitalElements/ .
dt = 60                                 # [s] Time step between simulation iterations. Use a larger value to improve MCMC performance. Use a smaller value for video generation or when accurate transit times are required.
epoch = 2460000                         # [days] Start date of the simulation, typically expressed as a Barycentric Julian Date (TDB).
sim_start =  2460001.9                  # [days] Start times of the intervals for which simulation data are calculated.
sim_end =    2460083.9                  # [days] End times of the intervals for which simulation data are calculated.
rv_body_name = SomeStar                 # Name of the star for which radial velocities were measured.

[Fitting]
eclipsers_names = SomePlanet            # Only primary transits of these bodies are considered when fitting transit times. Separate body names with commas.
eclipsees_names = SomeStar, AnotherStar # Only transits across these bodies are considered when fitting transit times. Separate body names with commas.

[Video]                                 #
video_file = video.mp4                  # The generated video is saved to this file. Comment out this parameter to disable video generation.
frames = 500                            # Integer: Number of video frames. Increasing this value increases both rendering time and animation length.
fps = 25                                # Integer: Frames per second. Set to 25 or higher for good quality. Higher values make the animation play faster and shorten its duration.
clockwise = False                       # When viewed from above, do the bodies orbit their primary clockwise?

[VideoScale]                            # Controls the visual scale of objects in the animation.
scope_left = 1.5 * au                   # [m] The left plot displays the region [-scope_left, scope_left]. The plot is centered on (0, 0).
scale_bar_length_left = 0.1 * au        # [m] Real-world length represented by the scale bar in the left plot.
star_scale_left = 6.0                   # If autoscaling is disabled, star radii are multiplied by this factor in the left view.
planet_scale_left = 20.0                # If autoscaling is disabled, planet radii are multiplied by this factor in the left view.
scope_right = 0.3 * au                  # [m] The right plot displays the region [-scope_right, scope_right]. The plot is centered on (0, 0).
scale_bar_length_right = 0.05 * au      # [m] Real-world length represented by the scale bar in the right plot.
star_scale_right = 6.0                  # If autoscaling is disabled, star radii are multiplied by this factor in the right view.
planet_scale_right = 20.0               # If autoscaling is disabled, planet radii are multiplied by this factor in the right view.
autoscaling = off                       # Allowed values: on, off
min_radius = 0.4                        # [%] If autoscaling is enabled, the smallest celestial body has this radius relative to the plot size. Radius = 100 would fill the entire plot.
max_radius = 2.0                        # [%] If autoscaling is enabled, the largest celestial body has this radius relative to the plot size. Radius = 100 would fill the entire plot. If necessary, scaling is performed logarithmically instead of linearly.

[VideoPlot]                             #
video_background_color = xkcd:dark forest green  # Exactly what it says. You can specify all colors in this configuration file as RGB tuples e.g. 0.5, 0.2, 0.9 or as strings e.g. white.
;video_background_color = xkcd:very dark green  # Exactly what it says. You can specify all colors in this configuration file as RGB tuples e.g. 0.5, 0.2, 0.9 or as strings e.g. white.
video_text_color = xkcd:light gray      # Color of all texts apart from main title. Also color of all tics and scale bars.
separator_line_color = xkcd:medium gray  # Color of vertical separator line between left plot and right plot.
scale_bar_fontsize = 8                  # Size of text of the scale bars.
show_left_plot = True                   # Show the star system viewed from above (upper-left plot)?
show_right_plot = True                  # Show the star system viewed from Earth (upper-right plot)?
show_upper_curve = True                 # Show the light curve plot (flux)?
show_lower_curve = True                 # Show the radial velocity plot?
main_title = Example 2                  # Main title of the plot.
main_title_color = xkcd:white           # Color of the main title on top of the video. You can specify all colors in this configuration file as RGB tuples e.g. 0.5, 0.2, 0.9 or as strings e.g. white.
main_title_fontsize = 14                # Fontsize of the main title on top of the video.
left_title = View from above (stars enlarged 6x, planet enlarged 20x)  # Title of the left plot.
left_title_fontsize = 10                # Fontsize of the title of the left plot (view from above) of the video.
left_title_y_coord = 0.9                # Vertical position of the title of the left plot (view from above) of the video. 0 is bottom. 1 is top.
show_left_scale_bar = True              # Show the scalebar of the left plot?
right_title = View from Earth (stars enlarged 6x, planet enlarged 20x, 5x zoom compared to the left side))  # Title of the right plot.
right_title_fontsize = 10               # Fontsize of the title of the right plot (view from above) of the video.
right_title_y_coord = 0.9               # Vertical position of the title of the right plot (view from above) of the video. 0 is bottom. 1 is top.
show_right_scale_bar = True             # Show the scalebar of the right plot?
dot_height = 1/17                       # Height of the red dot in the light curve plot relative to the y-axis height.
dot_width = 1/290                       # Width of the red dot in the light curve plot relative to the x-axis width.
x_ticks_fontsize = 8                    # Fontsize of the ticks (numbers) at the common time-axis/x-axis of both curve plots.
x_label = BJD (TDB)                     # Label at the common time-axis/x-axis of both curve plots.
x_label_fontsize = 8                    # Fontsize of the label at the common time-axis/x-axis of both curve plots.
x_label_x_coord = 0.97                  # Horizontal position of the label at the common time-axis/x-axis of both curve plots. 0 ist left. 1 is right.
x_label_y_coord = -0.07                 # Vertical position of the label at the common time-axis/x-axis of both curve plots. 0 ist bottom. 1 is top.
upper_curve_color = xkcd:white          # Color of the curve in the upper curve plot.
upper_curve_y_label = Relative Flux     # Label at the y-axis of the upper curve plot.
upper_curve_y_label_fontsize = 8        # Fontsize of the label at the y-axis of the upper curve plot.
upper_curve_y_tick_fontsize = 8         # Fontsize of the ticks at the y-axis of the upper curve plot.
upper_curve_dot_color = xkcd:nice blue  # Color of the moving dot in the upper curve plot.
lower_curve_color = xkcd:white          # Color of the curve in the lower curve plot.
lower_curve_y_label = Radial Velocity [m/s]  # Label at the y-axis of the lower curve plot.
lower_curve_y_label_fontsize = 8        # Fontsize of the label at the y-axis of the lower curve plot.
lower_curve_y_tick_fontsize = 8         # Fontsize of the ticks at the y-axis of the lower curve plot.
lower_curve_dot_color = 1, 1, 0         # Color of the moving dot in the lower curve plot.
figure_width = 16                       # Integer: Width of the figure containing all plots and animations. Adjust this parameter only if the plots in the video do not fit on your screen.
figure_height = 8                       # Integer: Height of the figure containing all plots and animations. Adjust this parameter only if the plots in the video do not fit on your screen.
xlim = 1.25                             # Left and right views show x-values between -xlim and +xlim. Adjust this parameter only if the plots in the video do not fit on your screen.
ylim = 1.0                              # Left and right views show y-values between -ylim and +ylim. Adjust this parameter only if the plots in the video do not fit on your screen.

[SomeStar]                              # All subsequent sections define celestial bodies in the simulation. Section names define the body names. REBOUND supports only plain ASCII characters in body names. When Jacobi coordinates are used, bodies must be ordered from the inside out (e.g., star, inner planet, outer planet).
color = 0.99, 0.99, 0.99                # [1], [1], [1] RGB values used in the animation. All three values must be between 0 and 1.
body_type = star                        # star or planet
mass = 1.0 * m_sun                      # [kg]
radius = 1.0 * r_sun                    # [m]
luminosity = 1.0 * l_sun                # [W]
limb_darkening_parameter_type = u       # limb_darkening_parameter_type = a  # q (Kipping parameters q1, q2), u (quadratic law parameters u1, u2), or a (polynomial coefficients a1, a2; do not provide a0).
limb_darkening_1 = 0.45                 # Limb-darkening coefficient 1.
limb_darkening_2 = 0.23                 # Limb-darkening coefficient 2.

[AnotherStar]                           #
color = 0.5, 0.5, 0.5                   # [1], [1], [1] RGB values used in the animation. All three values must be between 0 and 1.
body_type = star                        # star or planet
mass = 1.0 * m_sun                      # [kg]
radius = 1.0 * r_sun                    # [m]
luminosity = 1.0 * l_sun                # [W]
limb_darkening_parameter_type = u       # limb_darkening_parameter_type = a  # q (Kipping parameters q1, q2), u (quadratic law parameters u1, u2), or a (polynomial coefficients a1, a2; do not provide a0).
limb_darkening_1 = 0.45                 # Limb-darkening coefficient 1.
limb_darkening_2 = 0.23                 # Limb-darkening coefficient 2.
e = 0.0                                 # [1] Eccentricity.
i = 89.0                                # [deg] Inclination. 90°: the orbit is viewed edge-on. >90°: the planet moves below and in front of the star, as well as above and behind the star in the edge-on view.
a = 0.1 * au                            # [m] Semi-major axis. Provide P or a.
Omega = 0                               # [deg] Ω: longitude of ascending node. Specify two parameters out of Omega, omega, and pomega.
omega = 0                               # [deg] ω: argument of periapsis/pericenter/periastron. Specify two parameters out of Omega, omega, and pomega.
ma = 6                                  # [deg] Mean anomaly. Specify one parameter out of L, ma, ea, nu, and T.

[SomePlanet]                            #
color = xkcd:mango                      # [1], [1], [1] RGB values used in the animation. All three values must be between 0 and 1.
body_type = planet                      # star or planet
mass = 1.0 * m_earth                    # [kg]
radius = 15.0 * r_earth                 # [m]
e = 0.045                               # [1] Eccentricity.
i = 90.2                                # [deg] Inclination. 90°: the orbit is viewed edge-on. >90°: the planet moves below and in front of the star, as well as above and behind the star in the edge-on view.
a = 1.0 * au                            # [m] Semi-major axis. Provide P or a.
Omega = 0                               # [deg] Ω: longitude of ascending node. Specify two parameters out of Omega, omega, and pomega.
omega = 0                               # [deg] ω: argument of periapsis/pericenter/periastron. Specify two parameters out of Omega, omega, and pomega.
ma = 62                                 # [deg] Mean anomaly. Specify one parameter out of L, ma, ea, nu, and T.
